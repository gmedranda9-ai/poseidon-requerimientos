<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poseidón MK · Levantamiento de Requerimientos — Agente IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070B14;--bg-2:#0B1220;--surface:#0E1626;--surface-2:#111C30;
  --border:#1E2A42;--border-lit:#294066;
  --blue:#2B9DFF;--blue-deep:#0A6CE0;--cyan:#38E0FF;--gold:#FFB020;--gold-deep:#FF8A00;
  --text:#EAF1FB;--muted:#8494AD;--muted-2:#5D6B84;--ok:#28D07E;--danger:#FF5C6C;
  --ring:0 0 0 3px rgba(43,157,255,.25);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(1200px 600px at 80% -10%,rgba(43,157,255,.10),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(255,138,0,.06),transparent 55%),var(--bg);
  color:var(--text);font-family:'Inter',system-ui,sans-serif;line-height:1.55;min-height:100vh;padding-bottom:60px}
.wrap{max-width:920px;margin:0 auto;padding:0 20px}
header.top{padding:34px 0 18px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.logo{width:64px;height:64px;flex:none;filter:drop-shadow(0 0 14px rgba(43,157,255,.45))}
.brand h1{font-family:'Space Grotesk';font-weight:700;font-size:1.32rem;letter-spacing:.2px;line-height:1.15}
.brand p{color:var(--muted);font-size:.86rem;margin-top:2px}
.tag-conf{margin-left:auto;font-family:'Space Grotesk';font-size:.68rem;letter-spacing:1.5px;color:var(--gold);
  border:1px solid rgba(255,176,32,.35);border-radius:999px;padding:6px 12px;background:rgba(255,176,32,.06);white-space:nowrap}
.progress-shell{position:sticky;top:0;z-index:40;background:linear-gradient(var(--bg),rgba(7,11,20,.86));
  backdrop-filter:blur(8px);padding:14px 0 12px;border-bottom:1px solid var(--border)}
.pbar{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden;border:1px solid var(--border)}
.pbar>i{display:block;height:100%;width:11%;border-radius:999px;background:linear-gradient(90deg,var(--blue-deep),var(--blue),var(--cyan));
  box-shadow:0 0 12px rgba(43,157,255,.6);transition:width .4s cubic-bezier(.4,0,.2,1)}
.pmeta{display:flex;justify-content:space-between;margin-top:8px;font-size:.78rem;color:var(--muted)}
.pmeta b{color:var(--text);font-weight:600}.pmeta .stepname{color:var(--blue)}
main{padding-top:26px}
.step{display:none;animation:rise .35s ease}.step.active{display:block}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.step-head{margin-bottom:18px}
.step-kicker{font-family:'Space Grotesk';font-size:.74rem;letter-spacing:2px;color:var(--gold);margin-bottom:8px}
.step-head h2{font-family:'Space Grotesk';font-weight:600;font-size:1.5rem;line-height:1.2}
.step-head p{color:var(--muted);font-size:.92rem;margin-top:6px;max-width:64ch}
.field{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 18px 16px;margin-bottom:14px}
.field:focus-within{border-color:var(--border-lit)}
.q{font-weight:600;font-size:.98rem;margin-bottom:4px;display:flex;gap:8px;align-items:baseline}
.q .req{color:var(--gold);font-size:.8rem}
.hint{color:var(--muted);font-size:.83rem;margin-bottom:12px}
input[type=text],input[type=tel],input[type=email],input[type=number],input[type=date],textarea,select{
  width:100%;background:var(--bg-2);border:1px solid var(--border);color:var(--text);border-radius:10px;
  padding:11px 13px;font-family:inherit;font-size:.94rem;transition:border-color .15s,box-shadow .15s}
textarea{resize:vertical;min-height:88px;line-height:1.5}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--blue);box-shadow:var(--ring)}
input::placeholder,textarea::placeholder{color:var(--muted-2)}
select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='none' stroke='%238494AD' stroke-width='2'><path d='M4 6l4 4 4-4'/></svg>");
  background-repeat:no-repeat;background-position:right 13px center;padding-right:38px}
.choices{display:grid;gap:10px}.choices.cols-2{grid-template-columns:1fr 1fr}
@media(max-width:560px){.choices.cols-2{grid-template-columns:1fr}}
.choice{position:relative;display:flex;align-items:center;gap:11px;background:var(--bg-2);border:1px solid var(--border);
  border-radius:11px;padding:12px 14px;cursor:pointer;transition:.15s}
.choice:hover{border-color:var(--border-lit);background:var(--surface-2)}
.choice input{position:absolute;opacity:0;pointer-events:none}
.choice .box{width:20px;height:20px;flex:none;border:2px solid var(--muted-2);border-radius:6px;display:grid;place-items:center;transition:.15s}
.choice .box.round{border-radius:999px}
.choice .box svg{width:12px;height:12px;opacity:0;transform:scale(.5);transition:.15s;stroke:#04101f;stroke-width:3}
.choice input:checked~.box{background:linear-gradient(135deg,var(--blue),var(--cyan));border-color:var(--cyan)}
.choice input:checked~.box svg{opacity:1;transform:scale(1)}
.choice input:checked~.lbl{color:var(--text)}
.choice:has(input:checked){border-color:var(--blue);background:rgba(43,157,255,.08)}
.choice .lbl{font-size:.92rem;color:var(--muted)}
.choice input:focus-visible~.box{box-shadow:var(--ring)}
.repeat-row{display:grid;gap:8px;grid-template-columns:2fr 3fr 1fr auto;align-items:start;margin-bottom:8px}
.repeat-row.contacts{grid-template-columns:2fr 2fr 2fr auto}
@media(max-width:640px){.repeat-row,.repeat-row.contacts{grid-template-columns:1fr;padding:12px;border:1px dashed var(--border);border-radius:10px}}
.del-row{background:rgba(255,92,108,.1);border:1px solid rgba(255,92,108,.3);color:var(--danger);border-radius:9px;
  width:42px;height:42px;flex:none;cursor:pointer;font-size:1.1rem;display:grid;place-items:center;transition:.15s}
.del-row:hover{background:rgba(255,92,108,.2)}
.add-row{margin-top:4px;background:transparent;border:1px dashed var(--border-lit);color:var(--blue);border-radius:10px;
  padding:10px 14px;cursor:pointer;font-family:inherit;font-size:.88rem;font-weight:600;transition:.15s}
.add-row:hover{background:rgba(43,157,255,.08);border-color:var(--blue)}
[data-when]{display:none!important}[data-when].show{display:block!important;animation:rise .3s ease}[data-when].show{margin-top:14px}
.callout{border-left:3px solid var(--gold);background:rgba(255,176,32,.06);border-radius:0 10px 10px 0;
  padding:12px 15px;font-size:.86rem;color:#f2d9a8;margin-top:4px}
.callout.blue{border-color:var(--blue);background:rgba(43,157,255,.07);color:#bfe0ff}
.nav{display:flex;gap:12px;margin-top:24px;align-items:center}
.btn{font-family:'Space Grotesk';font-weight:600;font-size:.95rem;border-radius:11px;padding:13px 24px;cursor:pointer;
  border:1px solid transparent;transition:.18s;display:inline-flex;align-items:center;gap:9px}
.btn-primary{background:linear-gradient(135deg,var(--blue-deep),var(--blue));color:#fff;box-shadow:0 6px 20px -6px rgba(43,157,255,.6)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 10px 26px -6px rgba(43,157,255,.75)}
.btn-ghost{background:transparent;border-color:var(--border-lit);color:var(--muted)}
.btn-ghost:hover{color:var(--text);border-color:var(--blue)}
.btn-gold{background:linear-gradient(135deg,var(--gold-deep),var(--gold));color:#2a1800}
.btn-gold:hover{transform:translateY(-1px);box-shadow:0 10px 26px -6px rgba(255,176,32,.6)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important;box-shadow:none!important}
.nav .spacer{flex:1}
.decl{background:linear-gradient(160deg,var(--surface-2),var(--surface));border:1px solid var(--border-lit);border-radius:16px;padding:22px}
.decl h3{font-family:'Space Grotesk';font-size:1.05rem;margin-bottom:10px}
.decl .legal{font-size:.86rem;color:#c9d6ea;background:var(--bg-2);border:1px solid var(--border);border-radius:11px;padding:14px 16px;margin-bottom:16px;line-height:1.6}
.decl .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.decl .grid2{grid-template-columns:1fr}}
.consent{display:flex;gap:12px;align-items:flex-start;margin-top:16px;cursor:pointer;background:var(--bg-2);border:1px solid var(--border);border-radius:11px;padding:14px}
.consent:has(input:checked){border-color:var(--gold);background:rgba(255,176,32,.06)}
.consent input{position:absolute;opacity:0}
.consent .box{width:22px;height:22px;flex:none;border:2px solid var(--muted-2);border-radius:6px;display:grid;place-items:center;margin-top:1px}
.consent .box svg{width:13px;height:13px;opacity:0;stroke:#2a1800;stroke-width:3}
.consent input:checked~.box{background:var(--gold);border-color:var(--gold)}
.consent input:checked~.box svg{opacity:1}
.consent span{font-size:.88rem;color:#dbe6f5}
label.mini{display:block;font-size:.76rem;color:var(--muted);margin-bottom:5px;font-weight:500}
#resumen{display:none}
.footnote{text-align:center;color:var(--muted-2);font-size:.76rem;margin-top:30px}
.err-flash{color:var(--danger);font-size:.83rem;margin-top:10px;display:none}.err-flash.show{display:block}

@media(max-width:600px){
  .wrap{padding:0 14px}
  header.top{padding:22px 0 14px;gap:12px}
  .logo{width:50px;height:50px}
  .brand h1{font-size:1.08rem}
  .tag-conf{margin-left:0;order:3}
  .step-head h2{font-size:1.24rem}
  .step-head p{font-size:.88rem}
  .field{padding:15px 14px 14px}
  .q{font-size:.94rem}
  input[type=text],input[type=tel],input[type=email],input[type=number],input[type=date],textarea,select{font-size:16px}
  .nav{flex-wrap:wrap}
  .nav .btn{flex:1 1 auto;justify-content:center;padding:14px 16px}
  .nav .spacer{display:none}
  .pmeta{font-size:.72rem}
}
@media print{
  @page{margin:15mm}
  body{background:#fff;color:#111;padding:0}.wrap{max-width:100%}
  header.top,.progress-shell,main,.footnote{display:none!important}
  #resumen{display:block!important}
  .r-head{display:flex;align-items:center;gap:14px;border-bottom:2px solid #0A6CE0;padding-bottom:12px;margin-bottom:6px}
  .r-head img{width:52px;height:52px}
  .r-head h1{font-family:'Space Grotesk';font-size:16pt;color:#0A2A52}
  .r-head .sub{font-size:9pt;color:#555}
  .r-conf{margin-left:auto;font-size:7.5pt;letter-spacing:1px;color:#B26A00;border:1px solid #E0A030;border-radius:20px;padding:4px 10px}
  .r-sec{margin-top:14px;break-inside:avoid}
  .r-sec h2{font-family:'Space Grotesk';font-size:11pt;color:#0A6CE0;border-bottom:1px solid #cdd8e6;padding-bottom:4px;margin-bottom:8px}
  .r-item{margin-bottom:7px;font-size:9.3pt}
  .r-q{font-weight:600;color:#223}.r-a{color:#333;white-space:pre-wrap}.r-a.empty{color:#999;font-style:italic}
  .r-decl{margin-top:18px;border:1.5px solid #0A6CE0;border-radius:8px;padding:12px;break-inside:avoid;font-size:9pt}
  .r-decl h3{font-family:'Space Grotesk';font-size:10.5pt;margin-bottom:6px;color:#0A2A52}
  .r-sign{display:flex;justify-content:space-between;margin-top:30px;font-size:9pt}
  .r-sign div{border-top:1px solid #333;padding-top:5px;width:44%;text-align:center;color:#555}
  .r-foot{margin-top:16px;font-size:7.5pt;color:#888;text-align:center;border-top:1px solid #ddd;padding-top:8px}
}
</style>
</head>

<script>/* ===== Helpers para construir campos ===== */
const chk = `<svg viewBox="0 0 14 14" fill="none"><path d="M2 7l3.5 3.5L12 3.5"/></svg>`;
function radio(name,opts,cols){return `<div class="choices ${cols?'cols-2':''}">`+opts.map(o=>{const v=(typeof o==='object')?o.v:o;const l=(typeof o==='object')?(o.l||o.v):o;return `<label class="choice"><input type="radio" name="${name}" value="${v}"><span class="box round">${chk}</span><span class="lbl">${l}</span></label>`;}).join('')+`</div>`;}
function checks(name,opts,cols){return `<div class="choices ${cols?'cols-2':''}">`+opts.map(o=>`<label class="choice"><input type="checkbox" name="${name}" value="${o}"><span class="box">${chk}</span><span class="lbl">${o}</span></label>`).join('')+`</div>`;}

const STEPS=[
{name:"Tu empresa", kicker:"01 · Identidad", title:"Cuéntanos sobre tu empresa",
 intro:"Empecemos por lo básico: quiénes son y a qué se dedican. Esto le da contexto al agente para hablar como parte de tu equipo.",
 html:`
 <div class="field"><div class="q">Nombre de la empresa <span class="req">*</span></div>

 <div class="field"><div class="q">¿A qué se dedica tu empresa? <span class="req">*</span></div>

   <textarea data-key="A qué se dedica" data-req placeholder="Ej: Centro de diagnóstico automotriz. Ofrecemos revisión técnica vehicular, cursos de emisiones y mantenimiento preventivo."></textarea></div>
 <div class="field"><div class="q">Sitio web y redes sociales</div>
   <div class="hint">El agente puede compartir estos enlaces cuando el cliente los pida.</div>
   <div style="display:grid;gap:8px">
     <input type="text" data-key="Sitio web" placeholder="Sitio web (ej: www.tuempresa.com)">

 <div class="field"><div class="q">Contacto principal del proyecto <span class="req">*</span></div>

   <div style="display:grid;gap:8px">
     <input type="text" data-key="Contacto - Nombre" data-req placeholder="Nombre completo">
     <input type="text" data-key="Contacto - Cargo" placeholder="Cargo">

/* ===== Render ===== */
const form=document.getElementById('form');
STEPS.forEach((s,i)=>{
  const sec=document.createElement('section');
  sec.className='step'+(i===0?' active':'');
  sec.dataset.step=i;
  sec.innerHTML=`<div class="step-head"><div class="step-kicker">${s.kicker}</div><h2>${s.title}</h2><p>${s.intro}</p></div>${s.html}
    <div class="nav">
      ${i>0?'<button type="button" class="btn btn-ghost" data-back>← Atrás</button>':''}

/* filas repetibles iniciales */

  r.innerHTML=`<input type="text" data-rep="oferta" data-col="Nombre" placeholder="Nombre"><input type="text" data-rep="oferta" data-col="Descripción" placeholder="Descripción breve"><input type="text" data-rep="oferta" data-col="Precio" placeholder="Precio"><button type="button" class="del-row">×</button>`;
  r.querySelector('.del-row').onclick=()=>r.remove();w.appendChild(r);}
function addContacto(id){const w=document.getElementById(id);const r=document.createElement('div');r.className='repeat-row contacts';

  r.innerHTML=`<input type="text" data-rep="${key}" data-col="Nombre" placeholder="Nombre"><input type="text" data-rep="${key}" data-col="Cargo" placeholder="Cargo"><input type="text" data-rep="${key}" data-col="WhatsApp/Correo" placeholder="WhatsApp o correo"><button type="button" class="del-row">×</button>`;

/* ===== Navegación ===== */
let cur=0;const total=STEPS.length;
const pfill=document.getElementById('pfill'),pcur=document.getElementById('pcur'),
  pname=document.getElementById('pname'),ppct=document.getElementById('ppct');
document.getElementById('ptot').textContent=total;
function show(n){
  document.querySelectorAll('.step').forEach(s=>s.classList.remove('active'));
  document.querySelector(`.step[data-step="${n}"]`).classList.add('active');
  cur=n;const pct=Math.round(((n+1)/total)*100);
  pfill.style.width=pct+'%';pcur.textContent=n+1;pname.textContent=STEPS[n].name;ppct.textContent=pct+'%';
  refreshConditionals(document.querySelector(`.step[data-step="${n}"]`));
  // Rellenar resumen de firma con datos del paso 1
  if(n===total-1){
    const fr=document.getElementById('firmaResumen');
    if(fr){
      const nom=(document.querySelector('[data-key="Contacto - Nombre"]')||{}).value||'';
      const emp=(document.querySelector('[data-key="Empresa"]')||{}).value||'';
      const car=(document.querySelector('[data-key="Contacto - Cargo"]')||{}).value||'';
      fr.innerHTML = (nom||emp) ? `Yo, <b>${nom||'—'}</b>${car?' ('+car+')':''} en representación de <b>${emp||'—'}</b>, declaro lo siguiente:` : 'Completa el paso 1 (empresa y contacto) para continuar.';
    }
  }
  window.scrollTo({top:0,behavior:'smooth'});
}
form.addEventListener('click',e=>{
  if(e.target.closest('[data-next]')){if(validateStep(cur))show(cur+1);}
  if(e.target.closest('[data-back]'))show(cur-1);
});
function validateStep(n){
  const step=document.querySelector(`.step[data-step="${n}"]`);
  let ok=true;
  step.querySelectorAll('[data-req]').forEach(inp=>{
    if(inp.offsetParent===null)return; // oculto por condicional
    if(!inp.value.trim()){ok=false;inp.style.borderColor='var(--danger)';inp.style.boxShadow='0 0 0 3px rgba(255,92,108,.15)';
      inp.addEventListener('input',()=>{inp.style.borderColor='';inp.style.boxShadow='';},{once:true});}
  });
  if(!ok)window.scrollTo({top:0,behavior:'smooth'});
  return ok;
}

/* ===== Condicionales ===== */
function refreshConditionals(scope){
  (scope||document).querySelectorAll('[data-when]').forEach(el=>{
    const idx=el.dataset.when.indexOf('=');
    const name=el.dataset.when.slice(0,idx);
    const val=el.dataset.when.slice(idx+1);
    const sel=document.querySelector(`input[name="${name}"]:checked`);
    const show=!!(sel && sel.value===val);
    el.classList.toggle('show', show);
  });
}
form.addEventListener('change',e=>{
  if(e.target.type==='radio'){ refreshConditionals(e.target.closest('.step')); }
});

/* ===== Descargar PDF ===== */
// URL del webhook de n8n (se configura al montar el workflow)
const WEBHOOK_URL = "https://mkposeidon.com/webhook/requerimientos";

document.getElementById('downloadBtn').addEventListener('click',async ()=>{
  const nombre=document.querySelector('[data-key="Contacto - Nombre"]').value.trim();
  const empresa=document.querySelector('[data-key="Empresa"]').value.trim();
  const tel=document.querySelector('[data-key="Contacto - Teléfono"]').value.trim();
  const ced=document.querySelector('[data-key="Firma - Cédula"]').value.trim();
  const consent=document.getElementById('consentBox').checked;
  if(!nombre||!empresa||!tel||!ced||!consent){document.getElementById('declErr').classList.add('show');return;}
  document.getElementById('declErr').classList.remove('show');

  // Recolectar TODAS las respuestas
  const respuestas=recolectarTodo();

  // Enviar a n8n (no bloquea la descarga si falla)
  const btn=document.getElementById('downloadBtn');
  const txtOrig=btn.textContent;
  btn.textContent="Enviando...";btn.disabled=true;
  try{
    await fetch(WEBHOOK_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(respuestas)
    });
    btn.textContent="✅ ¡Enviado!";
    setTimeout(()=>{alert("¡Listo! Tus requerimientos fueron enviados a Poseidón MK. Te llegará una copia por WhatsApp al número que indicaste. 🔱");},300);
  }catch(e){
    btn.textContent="⚠️ Guarda tu PDF";
    alert("No se pudo enviar automáticamente, pero puedes descargar tu PDF y enviárnoslo. 🔱");
    buildResumen();
    setTimeout(()=>window.print(),400);
  }
  setTimeout(()=>{btn.textContent=txtOrig;btn.disabled=false;},4000);
});

// Recolecta todas las respuestas del formulario en un objeto
function recolectarTodo(){
  const g=id=>{const s=document.querySelector(`input[name="${id}"]:checked`);return s?s.value:'';};
  const labelsChk=name=>[...document.querySelectorAll(`input[name="${name}"]:checked`)].map(i=>i.value);
  const v=key=>{const el=document.querySelector(`[data-key="${key}"]`);return el?el.value.trim():'';};
  function rep(key){const rows=[];const seen=new Set();
    document.querySelectorAll(`[data-rep="${key}"]`).forEach(inp=>{const r=inp.closest('.repeat-row');
      if(!seen.has(r)){seen.add(r);const cols=[...r.querySelectorAll(`[data-rep="${key}"]`)].map(x=>x.value.trim()).filter(Boolean);if(cols.length)rows.push(cols.join(' · '));}});
    return rows;}
  return {
    empresa:v("Empresa"), giro:v("A qué se dedica"),
    sitio_web:v("Sitio web"), instagram:v("Instagram"), facebook:v("Facebook"), otra_red:v("TikTok / Otra red"),
    contacto_nombre:v("Contacto - Nombre"), contacto_cargo:v("Contacto - Cargo"),
    contacto_telefono:v("Contacto - Teléfono"), contacto_correo:v("Contacto - Correo"),
    ciudad_pais:v("Ciudad / País"),
    comportamiento:v("Descripción del comportamiento"), nombre_agente:v("Nombre del agente"),
    objetivo:g("objetivo"), tono:g("tono"), saludo:v("Saludo inicial"),
    horario:g("horario")==="Horario específico"?v("Horario específico"):g("horario"), seguimiento:g("seguimiento"),
    tipo_oferta:g("tipo_oferta"), oferta:rep("oferta"), material:g("material"),
    proformas:g("proformas"), contenido_proforma:v("Contenido de la proforma"),
    pagos:g("pagos"), pasarela:g("pasarela"), cuotas:g("cuotas"), comprobante:g("comprobante"), factura:g("factura"),
    datos_capturar:labelsChk("datos"), datos_adicionales:v("Datos adicionales"), almacen:g("almacen"),
    deriva:g("deriva"), casos_deriva:labelsChk("casos_deriva"), personas_atienden:rep("contacto"), supervisores:rep("visor"),
    reportes:g("reportes"), rep_freq:g("rep_freq"), rep_metricas:labelsChk("rep_metricas"), rep_medio:g("rep_medio"),
    remarketing:g("remarketing"), rmk_target:labelsChk("rmk_target"),
    num_wa_agente:g("num_wa")==="Sí, tengo un número dedicado listo"?v("Número WhatsApp"):g("num_wa"),
    fuera_alcance:labelsChk("fuera"), notas:v("Notas libres"),
    cedula:v("Firma - Cédula"), fecha_firma:v("Firma - Fecha")||new Date().toLocaleDateString('es-EC')
  };
}

/* ===== Construir resumen imprimible ===== */
function labelsChecked(name){return [...document.querySelectorAll(`input[name="${name}"]:checked`)].map(i=>i.value);}
function val(key){const el=document.querySelector(`[data-key="${key}"]`);return el?el.value.trim():'';}
function repRows(key){const rows=[];document.querySelectorAll(`[data-rep="${key}"]`).forEach(inp=>{
  const r=inp.closest('.repeat-row');if(!r.__seen){r.__seen=true;
    const cols=[...r.querySelectorAll(`[data-rep="${key}"]`)].map(x=>x.value.trim()).filter(Boolean);
    if(cols.length)rows.push(cols.join(' · '));}});
  document.querySelectorAll(`[data-rep="${key}"]`).forEach(inp=>{delete inp.closest('.repeat-row').__seen;});
  return rows;}

function item(q,a){const empty=!a||(Array.isArray(a)&&!a.length);
  const txt=Array.isArray(a)?a.join(', '):a;
  return `<div class="r-item"><span class="r-q">${q}:</span> <span class="r-a ${empty?'empty':''}">${empty?'—':txt}</span></div>`;}

function buildResumen(){
  const g=id=>{const s=document.querySelector(`input[name="${id}"]:checked`);return s?s.value:'';};
  const today=val("Firma - Fecha")||new Date().toLocaleDateString('es-EC');
  const R=document.getElementById('resumen');
  R.innerHTML=`
  <div class="r-head"><img src="${window.__LOGO__}"><div><h1>Levantamiento de Requerimientos — Agente IA</h1>
    <div class="sub">Poseidón MK · Automatización de procesos con IA · ${today}</div></div>
    <div class="r-conf">CONFIDENCIAL</div></div>

  <div class="r-sec"><h2>1 · Empresa</h2>
    ${item("Empresa",val("Empresa"))}${item("A qué se dedica",val("A qué se dedica"))}
    ${item("Sitio web",val("Sitio web"))}${item("Instagram",val("Instagram"))}${item("Facebook",val("Facebook"))}${item("TikTok / Otra",val("TikTok / Otra red"))}
    ${item("Contacto",[val("Contacto - Nombre"),val("Contacto - Cargo"),val("Contacto - Teléfono"),val("Contacto - Correo")].filter(Boolean).join(' · '))}
    ${item("Ciudad / País",val("Ciudad / País"))}</div>

  <div class="r-sec"><h2>2 · El agente</h2>
    ${item("Comportamiento deseado",val("Descripción del comportamiento"))}
    ${item("Nombre del agente",val("Nombre del agente"))}
    ${item("Objetivo principal",g("objetivo"))}${item("Tono",g("tono"))}
    ${item("Saludo inicial",val("Saludo inicial"))}
    ${item("Horario",g("horario")==="Horario específico"?val("Horario específico"):g("horario"))}
    ${item("Seguimiento",g("seguimiento"))}</div>

  <div class="r-sec"><h2>3 · Oferta</h2>
    ${item("Tipo de oferta",g("tipo_oferta"))}
    ${item("Servicios / productos",repRows("oferta"))}
    ${item("Material digital",g("material"))}</div>

  <div class="r-sec"><h2>4 · Proformas y pagos</h2>
    ${item("Genera proformas",g("proformas"))}${item("Contenido de proforma",val("Contenido de la proforma"))}
    ${item("Maneja pagos",g("pagos"))}${item("Pasarela",g("pasarela"))}${item("Cuotas",g("cuotas"))}
    ${item("Comprobante al cliente",g("comprobante"))}${item("Factura electrónica",g("factura"))}</div>

  <div class="r-sec"><h2>5 · Datos del cliente</h2>
    ${item("Datos a capturar",labelsChecked("datos"))}${item("Datos adicionales",val("Datos adicionales"))}
    ${item("Almacenamiento",g("almacen"))}</div>

  <div class="r-sec"><h2>6 · Derivación y supervisión</h2>
    ${item("Deriva a humano",g("deriva"))}${item("Casos de derivación",labelsChecked("casos_deriva"))}
    ${item("Personas que atienden",repRows("contacto"))}
    ${item("Supervisores del visor",repRows("visor"))}</div>

  <div class="r-sec"><h2>7 · Reportes y remarketing</h2>
    ${item("Reportes",g("reportes"))}${item("Frecuencia",g("rep_freq"))}${item("Métricas",labelsChecked("rep_metricas"))}
    ${item("Medio de reportes",g("rep_medio"))}
    ${item("Remarketing",g("remarketing"))}${item("Público de remarketing",labelsChecked("rmk_target"))}</div>

  <div class="r-sec"><h2>8 · WhatsApp y alcance</h2>
    ${item("Número WhatsApp",g("num_wa")==="Sí, tengo un número dedicado listo"?val("Número WhatsApp"):g("num_wa"))}
    ${item("Fuera de alcance (confirmado)",labelsChecked("fuera"))}
    ${item("Notas libres",val("Notas libres"))}</div>

  <div class="r-decl"><h3>Declaración de conformidad</h3>
    <div>Declaro que la información proporcionada es verídica y completa, y constituye la base acordada para el desarrollo del agente de IA por parte de Poseidón MK. Las funcionalidades no descritas quedan fuera del alcance inicial.</div>
    <div class="r-sign">
      <div>${val("Contacto - Nombre")||'—'}<br><span style="font-size:8pt">${val("Contacto - Cargo")||''} · C.I./RUC ${val("Firma - Cédula")||'—'}</span><br><span style="font-size:8pt">${val("Empresa")||'Cliente'}</span></div>
      <div>Poseidón MK<br><span style="font-size:8pt">Automatización con IA</span><br><span style="font-size:8pt">poseidonmk.com</span></div>
    </div></div>
  <div class="r-foot">Documento generado el ${today} · Poseidón MK — Con esta información se elaborará el Documento de Alcance formal.</div>`;
}
</script>
</body>
</html>
